<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Progess Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <ul class="breadcrumb bg-info" >
                    <li class="breadcrumb-item"><a href="#" style="color:ghostwhite">Home</a></li>
                    <li class="breadcrumb-item"><a href="#" style="color:ghostwhite">Courses</a></li>
                    <li class="breadcrumb-item"><a href="#" style="color:ghostwhite">Web Development</a></li>
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <h1 class="display-5 text-center">Web Development Course<span class="badge badge-info">New</span></h1>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="progress" style="height:30px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:100%;">HTML</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width:70%;">CSS</div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:50%;background-color:orange;">Javascript</div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width:25%;">Bootstrap</div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12" style="margin-top:50px;margin-left:30%;">
                <button type="button" class="btn btn-info btn-lg" style="margin-right:5%;">Start</button>
                <button type="button" class="btn btn-primary btn-sm" style="margin-right:5%;">Pause</button>
                <button type="button" class="btn btn-secondary btn-danger">Reset</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <ul class="pagination" style="justify-content: center;margin-top:30%;">
                    <li class="page-item active" ><a class="page-link" href="#">1</a></li>
                    <li class="page-item" ><a class="page-link" href="#">2</a></li>
                    <li class="page-item disabled" ><a class="page-link" href="#">3</a></li>
                </ul>
            </div>
        </div>
    </div>
    
</body>
</html>
