<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container justify-content-center">
        <div class="row">
            <div class="col-md-12">
                <ul class="breadcrumb bg-warning">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page"><a href="#">My Courses</a></li>
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 text-center">
                <button type="button" style="margin-bottom:10px;" class="btn btn-outline-warning btn-md">Start New Course</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 text-center">
                    <button type="button" class="btn btn-warning">My Progress <span class="badge badge-light">3 Courses</span></button> 
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">

                <div class="progress" style="margin-top:15px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width:70%;">70%</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12" style="margin-top:15px;margin-left:100px;">
                <ul class="pagination">
                    <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>

                </ul>
            </div>
        </div>
    </div>
</body>
</html>
