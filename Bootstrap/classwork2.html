<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Students Profile and Grades</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h1 class="display-1">Student Profile</h1>
            </div>
        </div>
        <div class="row">    
            <div class="col-md-12">
                <blockquote class="blockquote">
                     <h3>Learning never exhausts the mind.</h3>
                </blockquote>
            </div>
        </div>
        <div class="row">    
            <div class="col-md-12">
                <img src="https://img.magnific.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_test_b&w=740&q=80" class="rounded-circle mx-auto d-block" width="500px" height="400px">
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <table class="table table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th>Subjects</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Maths</td>
                            <td>78</td>
                        </tr>
                        <tr>
                            <td>English</td>
                            <td>59</td>
                        </tr>
                        <tr>
                            <td>Chemistry</td>
                            <td>77</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="alert alert-success">
                    <p>Profile updated successfully!</p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
