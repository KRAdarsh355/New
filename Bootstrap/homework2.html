<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h1 class="display-1 text-info" style="text-align: center;">LivePrinters</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <h1 style="text-align: center;">Printing with precision and passion.</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <blockquote class="blockquote">
                    <p style="text-align: center;">A boat doesn't go forward if each one is rowing their own way.</p>
                </blockquote>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <ul class="list-unstyled
                 text-info" style="text-align: center;">
                    <li>Leadership</li>
                    <li>Loyalty</li>
                    <li>Optimism</li>
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyufp8pnUaKJ4huHag2Ov5c4qZ32OrryO89UKeA2nDwg&s=10" class="rounded-circle mx-auto d-block" width="500px" height="400px">
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <table class="table table-bordered">
                    <thead class="thead-dark">
                        <tr>
                            <td><strong>Name</strong></td>
                            <td><strong>Role</strong></td>
                            <td><strong>Status</strong></td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="bg-success">
                            <td>Justin</td>
                            <td>Manager</td>
                            <td>Active</td>
                        </tr>
                        <tr class="bg-danger">
                            <td>Sean</td>
                            <td>Supervisor</td>
                            <td>Leave</td>
                        </tr>
                        <tr class="bg-secondary">
                            <td>Jonny</td>
                            <td>Accountant</td>
                            <td>Resigned</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="alert alert-danger">
                    <p><strong>Members are not active currently.</strong></p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
