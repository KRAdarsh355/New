<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body >
    <div class="container" style="background-color:bisque">
        <h1 class="display-2 text-center bg-danger text-white">Feedback Form</h1>
        <div class="form-group">
            <label for="user">Name: </label>
            <input type="text" class="form-control" id="user" placeholder="Enter your name" name="username">
        </div>
        <div class="form-group">
            <label for="email">Email: </label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" name="email">
        </div>
        <div class="form-group">
            <label for="comm">Feedback:</label>
            <textarea class="form-control" id="comm" rows="4" placeholder="Comment here"></textarea>
        </div>
        <div class="form-group">
            <label for="sel1">How you found us?</label>
            <select id="sel1" class="form-control">
                <option value="" selected hidden></option>
                <option>Friends</option>
                <option>Instagram</option>
                <option>Youtube</option>
                <option>Google</option>
            </select>
        </div>
        <p>Satisfaction level: </p>
        <div class="form-check-inline">
            <input type="radio" class="form-check-input" name="chck">
            <label class="form-check-label">1</label>
        </div>
        <div class="form-check-inline">
           <input type="radio" class="form-check-input" name="chck">
            <label class="form-check-label">2</label>
        </div>
        <div class="form-check-inline">
            <input type="radio" class="form-check-input" name="chck">
            <label class="form-check-label">3</label>
        </div>
        <div class="form-check-inline">
            <input type="radio" class="form-check-input" name="chck">
            <label class="form-check-label">4</label>
        </div>

        <div class="form-check-inline">
            <input type="radio" class="form-check-input" name="chck">
            <label class="form-check-label">5</label>
        </div>
        <div class="d-flex justify-content-center">
        <button type="submit" class="btn btn-danger ">Post</button>
        </div>
    </div>
</body>
</html>
