<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyTravels</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>
  <div class="container-fluid p-0 ">
    <h1 class="display-2 font-italic font-weight-bold bg-primary text-danger text-center">
      Skytravels
    </h1>
    <div id="demo1" class="carousel slide mx-auto" data-ride="carousel" style="width:900px;">
      <ul class="carousel-indicators">
        <li data-target="#demo1" data-slide-to="0" class="active"></li>
        <li data-target="#demo1" data-slide-to="1"></li>
        <li data-target="#demo1" data-slide-to="2"></li>
      </ul>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqEqcUQ1GW1yPJfm16bj5O2PJfDcGNhjypU5t-b5U83g&s=10"
            alt="Hawaii Beach" width="900" height="600" />
          <div class="carousel-caption">
            <h1 class="text-white">Hawaii Beach</h1>
          </div>
        </div>
        <div class="carousel-item">
          <img
            src="https://internationalliving.com/_next/image/?url=https%3A%2F%2Fimages.ctfassets.net%2Fwv75stsetqy3%2F18jOEJrhKM7WA81nkCKZV8%2F6f70df258ed1233d5c3a8e3f01298b06%2FGreece.jpg%3Fq%3D60%26fit%3Dfill%26fm%3Dwebp&w=3840&q=60"
            alt="Greece" width="900" height="600" />
          <div class="carousel-caption">
            <h1 class="text-white">Greece</h1>
          </div>
        </div>
        <div class="carousel-item">
          <img
            src="https://www.miamibeachfl.gov/wp-content/uploads/bb-plugin/cache/MiamiBeach-SouthBeachSunset-square-9546f746bf6f1276882f0c7daf7127da-3n0g7bco82hf.jpg"
            alt="Miami" width="900" height="600" />
          <div class="carousel-caption">
            <h1 class="text-white">Miami</h1>
          </div>
        </div>
      </div>
      <a class="carousel-control-prev" href="#demo1" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </a>
      <a class="carousel-control-next" href="#demo1" data-slide="next">
        <span class="carousel-control-next-icon"></span>
      </a>
    </div>
    <div class="d-flex justify-content-center my-3">
      <button type="button" class="btn btn-danger text-white " data-toggle="modal" data-target="#myModal">
      Book Now
      </button>
    </div>
  <div class="modal" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Book Now</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          This summer our team provides a fun trip to Hawaii,Miami and Greece.<br>
          Packages are available for all the places.<br>
          Prices may vary with additional services.<br>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
        </div>
        </div>
    </div>

  </div>
</body>

</html>
