<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Track</title>
  </head>
  <h1>Sales Track</h1>
  <p>Tshirts sold = 5</p>
  <p>Price = 400</p>
  <p>Caps sold =3</p>
  <p>Price =150</p>
  <body>
    <script language="Javascript" type="text/javascript">
       var ts= 5
       var p=400
       var c= 3
       var pr=150
       var total= ts*p+c*pr;
       document.write("Total sales ="+total )
    </script>
    <p>Tshirt price changed to 450</p>
    <script type="text/javascript">
        var tsp=450
        var newtot= ts*tsp+c*pr
        document.write("Updated price="+newtot)
    </script>
  </body>
</html>
