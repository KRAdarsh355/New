<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Calc</title>
</head>
<body>
    <script>
        let brr="bread"
            jj="juice"
            frr="fruits"
        let brrp=50
            jjp=80
            frrp=25
        let brrq=2
            jjq=4
            frrq=3
        let tot= brrp*brrq+jjp*jjq+frrp*frrq
        console.log(brr +"="+ brrp*brrq)
        console.log(jj+"="+ jjp*jjq)
        console.log(frr+"="+ frrp*frrq)
        console.log("Total bill ="+ tot)
        frrq=5
        tot= brrp*brrq+jjp*jjq+frrp*frrq
        console.log("Updated bill ="+ tot)

    </script>
</body>
</html>
