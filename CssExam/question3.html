<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question3</title>
    <style>
        body{
            display:flex;
            margin:0;
            padding:0;
            height:100vh;
        }
        
        .box1{
            width:50%;
            display:flex;
            background-color:white;
            justify-content: center;
            align-items:center;
            padding:12px;
            height:100vh;
            box-sizing: border-box;
        }
        h2{
            color:#b66b5a;
            font-family:Arial, Helvetica, sans-serif;
            font-size:36px;
        }
        .box2{
            background-image:url("cssexam.jpeg");

            background-repeat:no-repeat;
            background-size:cover;
            background-position:center;
            width:50%;
            height:100vh;
        }
        .infobox{
            width:100%;
            max-width:350px;
            background-color:white;
            padding:20px;
            box-sizing:border-box;
        }
        input[type="email"]{
            width:100%;
            height:35px;
            box-sizing:border-box;
            
        }
        input[type="password"]{
            width:100%;
            height:35px;
            box-sizing:border-box;
            
        }
        input[type="submit"]{
            color:white;
            width:100%;
            height:43px;
            font-weight:bolder;
            letter-spacing: 2px;
            font-family:Arial, Helvetica, sans-serif;
            background-color:#b66b5a;
            box-sizing:border-box;
            border:none;
        }
       
        @media only screen and (max-width:600px)
        {
            
            .box2{
                display:none;
            }
            .box1{
                width: 100%;
                display:flex;
                justify-content:center;
                padding:20px;
                height:100vh;
                
            }
            
        }
    </style>
</head>
<body>
    <div class="box2"></div>
    <div class="box1">
        <div class="infobox">
            <h2>Login Form</h2>
            <form>
                <label style="font-size: larger;margin-top: 5px;" for="Email"><b>Email:</b></label><br>
                <input type="email" id="Email" name="Email" style="margin-top: 5px;" required><br>
                <label style="font-size: larger;margin-top: 7px;" for="Password"><b>Password:</b></label><br>
                <input type="password" id="Password" name="Password" style="margin-top: 4px;" required><br>
                <input type="checkbox" id="Check" name="Check" style="margin-top:6px;">
                <label for="Check" style="margin-top:6px;">Remember me</label><br> 
                <input type="submit" value="Login" required>
            </form>
        </div>

    </div>
    
</body>
</html>
