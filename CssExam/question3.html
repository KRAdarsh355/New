<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question3</title>
    <style>
        body{
            display:flex;
            margin:0;
            padding:0;

            height:100vh;
        }
        
        .box1{
            width:50%;
            display:flex;
            background-color:white;
            justify-content: left;
            padding-top:140px;
            height:100vh;
            box-sizing: border-box;
        }
        h2{
            
            color:#c96f5d;
            font-family:Arial, Helvetica, sans-serif;
            font-size:40px;
            margin-top:0;
            margin-bottom:20px;

        }
        .box2{
            background-image:linear-gradient(to bottom,#d3b3e0 0%,#dccbdf 55%,#f2e398 100%);;
            width:50%;
            height:100vh;
        }
        .infobox{
            width:100%;
            max-width:800px;
            background-color:white;
            padding:25px;
            box-sizing:border-box;
        }
        input[type="email"]{
            width:100%;
            height:38px;
            padding:6px 10px;
            box-sizing:border-box;

            
        }
        input[type="password"]{
            width:100%;
            height:38px;
            padding:6px 10px;
            box-sizing:border-box;
            
        }
        input[type="submit"]{
            color:white;
            width:100%;
            height:42px;
            font-weight:bolder;
            letter-spacing: 2px;
            font-family:Arial, Helvetica, sans-serif;
            background-color:#c96f5d;
            box-sizing:border-box;
            border:none;
        }
       
        @media only screen and (max-width:600px)
        {
            
            .box2{
                display:none;
            }
            .box1{
                width: 100%;
                display:flex;
                justify-content:center;
                padding:20px;
                height:100vh;
                
            }
            
        }
    </style>
</head>
<body>
    <div class="box2"></div>
    <div class="box1">
        <div class="infobox">
            <h2> Login Form</h2>
            <form>
                <label style="font-size: larger;font-family:sans-serif;" for="Email"><b>Email:</b></label><br>
                <input type="email" id="Email" name="Email" required style="margin-bottom:20px;"><br>
                <label style="font-size: larger;font-family:sans-serif;" for="Password"><b>Password:</b></label><br>
                <input type="password" id="Password" name="Password" required style="margin-bottom:20px;"><br>
                <input type="checkbox" id="Check" name="Check">
                <label for="Check" style="font-family:sans-serif;">Remember me</label><br> 
                <input type="submit" value="Login" required style="margin-top:20px;">
            </form>
        </div>

    </div>
    
</body>
</html>
